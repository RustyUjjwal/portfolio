<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found - Ujjwal Keshri</title>
    <link rel="icon" type="image/png" href="resources/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
    
    <script>
        (function () {
            try {
                var theme = localStorage.getItem('theme');
                if (theme) {
                    document.documentElement.classList.add(theme + '-mode');
                } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    document.documentElement.classList.add('dark-mode');
                } else {
                    document.documentElement.classList.add('light-mode');
                }
            } catch (e) {
                document.documentElement.classList.add('light-mode');
            }
        })();
    </script>
    
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="error-page-container">
        <div class="error-content">
            <h1 class="error-code">404</h1>
            <h2 class="error-title">Page Not Found</h2>
            <p class="error-message">Oops! The page you are looking for does not exist. It might have been moved or deleted.</p>
            <a href="index.html" class="btn btn--primary">Go Back Home</a>
        </div>
    </div>
</body>

</html>
